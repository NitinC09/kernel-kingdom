[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-kingdom"
version = "0.3.2"
description = "Pixel-art isometric live wallpaper / idle game whose kingdoms grow from your system's processes, RAM, CPU and containers."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
    # Windows: sin GTK, la ventana y el fondo usan pygame-ce (SDL2); todo con wheels listos
    "pycairo>=1.20; sys_platform == 'win32'",
    "pygame-ce>=2.5; sys_platform == 'win32'",
]
# Linux: PyGObject, pycairo, GTK 4 y gtk4-layer-shell vienen del sistema (ver README / install.sh)
keywords = ["wallpaper", "wayland", "pixel-art", "idle-game", "system-monitor"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Desktop Environment",
    "Topic :: Games/Entertainment :: Simulation",
]

[project.urls]
Homepage = "https://rsmedrano-cloud.github.io/kernel-kingdom/"
Source = "https://github.com/rsmedrano-cloud/kernel-kingdom"

[project.scripts]
kernel-kingdom = "reino.cli:main"

[tool.setuptools.packages.find]
include = ["reino*"]

[tool.setuptools.package-data]
reino = ["default_config.toml"]
